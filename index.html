<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Нежный вайб 🌸</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#fdf6ff; --card:#fff; --text:#3d3558; --text-light:#8e84aa;
      --accent:#c9aff5; --border:rgba(201,175,245,0.25);
      --sh-sm:0 2px 12px rgba(160,130,220,.10); --sh-md:0 8px 32px rgba(160,130,220,.16);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Nunito',sans-serif;background:var(--bg);
      background-image:radial-gradient(ellipse 80% 50% at 20% 0%,rgba(220,190,255,.25) 0%,transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 100%,rgba(249,168,212,.18) 0%,transparent 55%);
      color:var(--text);min-height:100vh;padding:40px 16px 80px}
    .wrap{max-width:680px;margin:0 auto}
    .hdr{text-align:center;margin-bottom:40px;animation:fD .6s ease both}
    .hdr-t{font-family:'Playfair Display',serif;font-style:italic;font-size:2.6rem;
      background:linear-gradient(135deg,#b87fff,#f06bba);-webkit-background-clip:text;
      -webkit-text-fill-color:transparent;background-clip:text;line-height:1.2;margin-bottom:6px}
    .hdr-s{color:var(--text-light);font-size:.95rem;font-weight:600;letter-spacing:.04em}
    .card{background:var(--card);border-radius:28px;border:1px solid var(--border);
      box-shadow:var(--sh-md);padding:28px;margin-bottom:24px;animation:fU .5s ease both}
    .lbl{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;color:var(--text);
      margin-bottom:18px;display:flex;align-items:center;gap:8px}
    .lbl::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
    #authCard{text-align:center}
    #authCard p{color:var(--text-light);font-size:.97rem;margin-bottom:20px}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border:none;border-radius:999px;
      font-family:'Nunito',sans-serif;font-weight:700;font-size:.97rem;cursor:pointer;
      transition:transform .22s,box-shadow .22s}
    .btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.98)}
    #loginBtn{background:linear-gradient(135deg,#5b8dee,#4070e0);color:#fff;font-size:1.05rem;
      padding:14px 28px;box-shadow:0 6px 20px rgba(91,141,238,.35);margin:0 auto}
    #loginBtn svg{width:20px;height:20px;flex-shrink:0}
    .sbwrap{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
    .sb{padding:11px 20px;border:2px solid transparent;border-radius:999px;
      font-family:'Nunito',sans-serif;font-weight:800;font-size:.95rem;cursor:pointer;
      transition:all .25s;background:var(--bb);color:var(--bt);box-shadow:0 3px 12px rgba(0,0,0,.06)}
    .sb:hover{transform:translateY(-3px) scale(1.04);border-color:var(--bbd)}
    .sb.on{border-color:var(--bbd);box-shadow:0 0 0 3px rgba(var(--bg2),.25)}
    .s1{--bb:#e0f7fb;--bt:#00808a;--bbd:#7dd8e0;--bg2:125,216,224}
    .s2{--bb:#fff4e2;--bt:#c06200;--bbd:#ffcc80;--bg2:255,180,80}
    .s3{--bb:#edf7ed;--bt:#2a7a2e;--bbd:#90d494;--bg2:100,200,100}
    .s4{--bb:#f5eeff;--bt:#7040b0;--bbd:#c9a8f0;--bg2:180,140,240}
    .s5{--bb:#fff0f5;--bt:#b03070;--bbd:#f0a0c0;--bg2:240,130,170}
    .s6{--bb:#eef0ff;--bt:#3040a0;--bbd:#9098e8;--bg2:120,140,230}
    .av{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2.5px solid var(--accent);flex-shrink:0}
    .avp{width:48px;height:48px;border-radius:50%;border:2.5px solid var(--accent);
      background:linear-gradient(135deg,#e8d5ff,#ffd5ec);display:flex;align-items:center;
      justify-content:center;font-size:1.3rem;font-weight:800;color:#9060c0;flex-shrink:0}
    .avs{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);flex-shrink:0}
    .avsp{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#e8d5ff,#ffd5ec);
      display:flex;align-items:center;justify-content:center;font-size:.95rem;font-weight:800;color:#9060c0;flex-shrink:0}
    .owrap{position:relative;flex-shrink:0}
    .odot{position:absolute;bottom:2px;right:2px;width:13px;height:13px;border-radius:50%;
      border:2.5px solid #fff;background:#b0bec5;z-index:2}
    .odot.on{background:#43e07a;box-shadow:0 0 0 3px rgba(67,224,122,.25);animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(67,224,122,.25)}50%{box-shadow:0 0 0 6px rgba(67,224,122,.1)}}
    #myInfo{display:flex;align-items:center;gap:16px;min-height:56px;flex-wrap:wrap}

    /* ══ ТАЙМЕР ══ */
    #timerBox{display:none;flex-direction:column;gap:12px;margin-top:16px;
      padding:16px 20px;border-radius:20px;border:2px solid var(--tc,#c9a8f0);background:var(--tbg,#f5eeff)}
    #timerBox.show{display:flex}
    .timer-top{display:flex;align-items:center;justify-content:space-between}
    .timer-left{display:flex;align-items:center;gap:12px}
    .tring{width:42px;height:42px;border-radius:50%;border:3px solid var(--trm,#ddd);
      border-top-color:var(--trc,#9060c0);flex-shrink:0}
    .tring.spin{animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .tinfo{display:flex;flex-direction:column;gap:2px}
    .tname{font-size:.75rem;font-weight:800;color:var(--ttx,#7040b0);letter-spacing:.08em;text-transform:uppercase}
    #tCur{font-size:1.5rem;font-weight:900;color:var(--ttx,#7040b0);font-variant-numeric:tabular-nums;letter-spacing:.02em}
    .timer-right{text-align:right}
    .ttlbl{font-size:.72rem;color:var(--ttx,#7040b0);opacity:.65;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
    #tTot{font-size:1rem;font-weight:800;color:var(--ttx,#7040b0);font-variant-numeric:tabular-nums}
    .timer-btns{display:flex;gap:8px}
    .tbtn{padding:7px 16px;border-radius:999px;border:1.5px solid var(--tc,#c9a8f0);
      background:transparent;color:var(--ttx,#7040b0);font-family:'Nunito',sans-serif;
      font-weight:800;font-size:.85rem;cursor:pointer;transition:all .2s}
    .tbtn:hover{background:var(--tc,#c9a8f0);color:#fff}
    .tbtn:active{transform:scale(.96)}
    .tbtn.start{background:var(--trc,#9060c0);color:#fff;border-color:var(--trc,#9060c0)}
    .tbtn.start:hover{opacity:.85}
    /* цвета по статусу */
    .tc1{--tbg:#e0f7fb;--tc:#7dd8e0;--trc:#00a8b5;--trm:#b2edf2;--ttx:#007a85}
    .tc2{--tbg:#fff4e2;--tc:#ffcc80;--trc:#e08000;--trm:#ffe0a0;--ttx:#c06200}
    .tc3{--tbg:#edf7ed;--tc:#90d494;--trc:#2a9a2e;--trm:#b8e8ba;--ttx:#1a6a1e}
    .tc4{--tbg:#f5eeff;--tc:#c9a8f0;--trc:#9060c0;--trm:#ddc8f8;--ttx:#7040b0}
    .tc5{--tbg:#fff0f5;--tc:#f0a0c0;--trc:#c0406a;--trm:#f8c8da;--ttx:#b03070}
    .tc6{--tbg:#eef0ff;--tc:#9098e8;--trc:#4050c0;--trm:#c0c8f0;--ttx:#3040a0}

    /* монитор */
    #gList{display:flex;flex-direction:column;gap:12px}
    .ui{display:flex;align-items:center;gap:14px;padding:16px 18px;
      background:linear-gradient(135deg,#fdfaff,#faf5ff);border-radius:20px;
      border:1px solid var(--border);box-shadow:var(--sh-sm);transition:all .22s}
    .ui:hover{transform:translateY(-3px);box-shadow:var(--sh-md)}
    .ui .inf{flex:1;min-width:0}
    .uname{font-weight:800;font-size:1.02rem;color:var(--text)}
    .ust{font-size:.9rem;color:var(--text-light);font-weight:600;margin-top:2px}
    .tbadge{display:inline-flex;align-items:center;gap:5px;font-size:.82rem;font-weight:800;
      border-radius:999px;padding:3px 11px;margin-top:5px}
    .tb1{color:#007a85;background:#e0f7fb}.tb2{color:#c06200;background:#fff4e2}
    .tb3{color:#1a6a1e;background:#edf7ed}.tb4{color:#7040b0;background:#f5eeff}
    .tb5{color:#b03070;background:#fff0f5}.tb6{color:#3040a0;background:#eef0ff}
    .onl{font-size:.75rem;font-weight:700;color:#2db860;background:#e8fff1;border-radius:999px;padding:2px 8px;margin-left:6px}
    .ofl{font-size:.75rem;font-weight:600;color:#aaa;background:#f3f3f3;border-radius:999px;padding:2px 8px;margin-left:6px}
    .sdot{width:14px;height:14px;border-radius:50%;background:var(--dc,#d0c0f0);box-shadow:0 0 0 3px rgba(255,255,255,.9);flex-shrink:0}

    /* чат */
    #msgs{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow-y:auto;
      padding:4px 2px 8px;margin-bottom:14px;scrollbar-width:thin;scrollbar-color:var(--accent) transparent}
    .msg{display:flex;gap:10px;align-items:flex-start;animation:fU .3s ease both}
    .msg.me{flex-direction:row-reverse}
    .bbl{max-width:72%;padding:10px 14px;border-radius:18px;font-size:.95rem;font-weight:600;
      line-height:1.4;word-break:break-word;background:linear-gradient(135deg,#f3eaff,#ffe8f5);
      color:var(--text);border:1px solid rgba(201,175,245,.3)}
    .msg.me .bbl{background:linear-gradient(135deg,#b87fff,#f06bba);color:#fff;border:none}
    .meta{font-size:.78rem;color:var(--text-light);font-weight:600;margin-bottom:3px}
    .msg.me .meta{text-align:right}
    .cinp{display:flex;gap:10px;align-items:center}
    #ci{flex:1;padding:12px 18px;border-radius:999px;border:1.5px solid rgba(201,175,245,.5);
      font-family:'Nunito',sans-serif;font-size:.97rem;font-weight:600;color:var(--text);
      background:#fdf6ff;outline:none;transition:border-color .2s}
    #ci:focus{border-color:var(--accent)}
    #csb{width:46px;height:46px;border-radius:50%;border:none;
      background:linear-gradient(135deg,#b87fff,#f06bba);color:#fff;font-size:1.2rem;
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      box-shadow:0 4px 14px rgba(184,127,255,.4);transition:transform .2s;flex-shrink:0}
    #csb:hover{transform:scale(1.08)}#csb:active{transform:scale(.95)}
    #chatCard{display:none}
    .empty{text-align:center;color:var(--text-light);padding:20px;font-size:1rem;font-weight:600}
    .err{color:#c0304a;background:#fff0f3;padding:14px 18px;border-radius:16px;font-size:.95rem;text-align:center;font-weight:600}
    #toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);
      background:linear-gradient(135deg,#6d3fcc,#c04090);color:#fff;padding:12px 24px;
      border-radius:999px;font-weight:700;font-size:.95rem;box-shadow:0 8px 28px rgba(130,60,180,.35);
      opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;z-index:1000}
    #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
    .ld{display:flex;align-items:center;gap:10px;color:var(--text-light);font-weight:600;font-size:.97rem}
    .ld span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);
      animation:bc 1.1s infinite ease;margin:0 2px}
    .ld span:nth-child(2){animation-delay:.18s}.ld span:nth-child(3){animation-delay:.36s}
    @keyframes fD{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fU{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes bc{0%,80%,100%{transform:scale(.7);opacity:.5}40%{transform:scale(1.1);opacity:1}}
    @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
    .pop{animation:pop .35s ease}
  </style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="hdr-t">нежный вайб 🌸</div>
    <div class="hdr-s">монитор настроения группы</div>
  </div>

  <div class="card" id="authCard">
    <p>Войди, чтобы выбирать настроение и видеть всех ✨</p>
    <button id="loginBtn" class="btn">
      <svg viewBox="0 0 24 24"><path fill="white" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.51h5.84c-.25 1.31-.98 2.42-2.07 3.16v2.63h3.35c1.96-1.81 3.09-4.47 3.09-7.25z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-1.01 7.28-2.73l-3.35-2.63c-1.01.68-2.29 1.08-3.93 1.08-3.02 0-5.58-2.04-6.49-4.79H.96v2.67C2.77 20.39 6.62 23 12 23z"/><path fill="#FBBC05" d="M5.51 14.21c-.23-.68-.36-1.41-.36-2.21s.13-1.53.36-2.21V7.34H.96C.35 8.85 0 10.39 0 12s.35 3.15.96 4.66l4.55-2.45z"/><path fill="#EA4335" d="M12 4.98c1.64 0 3.11.56 4.27 1.66l3.19-3.19C17.46 1.01 14.97 0 12 0 6.62 0 2.77 2.61.96 6.34l4.55 2.45C6.42 6.02 8.98 4.98 12 4.98z"/></svg>
      Войти через Google
    </button>
  </div>

  <div class="card" id="profileCard" style="display:none">
    <div class="lbl">Мой профиль</div>
    <div id="myInfo"><div class="ld"><span></span><span></span><span></span>Загрузка...</div></div>

    <!-- ТАЙМЕР -->
    <div id="timerBox">
      <div class="timer-top">
        <div class="timer-left">
          <div class="tring" id="tRing"></div>
          <div class="tinfo">
            <div class="tname" id="tName">статус</div>
            <div id="tCur">0:00:00</div>
          </div>
        </div>
        <div class="timer-right">
          <div class="ttlbl">всего сегодня</div>
          <div id="tTot">0:00:00</div>
        </div>
      </div>
      <div class="timer-btns">
        <button class="tbtn start" id="tBtnStart">▶ Старт</button>
        <button class="tbtn" id="tBtnStop">⏸ Пауза</button>
        <button class="tbtn" id="tBtnReset">↺ Сброс</button>
      </div>
    </div>
  </div>

  <div class="card" id="statusCard" style="display:none">
    <div class="lbl">Моё настроение</div>
    <div class="sbwrap">
      <button class="sb s1" data-s="Учусь"  data-c="#7dd8e0" data-e="📚" data-tc="tc1" data-tb="tb1">📚 Учусь</button>
      <button class="sb s2" data-s="Кофе"   data-c="#ffcc80" data-e="☕" data-tc="tc2" data-tb="tb2">☕ Кофе</button>
      <button class="sb s3" data-s="В игре" data-c="#90d494" data-e="🎮" data-tc="tc3" data-tb="tb3">🎮 В игре</button>
      <button class="sb s4" data-s="Дома"   data-c="#c9a8f0" data-e="🏠" data-tc="tc4" data-tb="tb4">🏠 Дома</button>
      <button class="sb s5" data-s="Гуляю"  data-c="#f0a0c0" data-e="🌿" data-tc="tc5" data-tb="tb5">🌿 Гуляю</button>
      <button class="sb s6" data-s="Сплю"   data-c="#9098e8" data-e="💤" data-tc="tc6" data-tb="tb6">💤 Сплю</button>
    </div>
  </div>

  <div class="card">
    <div class="lbl">Монитор группы</div>
    <div id="gList"><div class="ld"><span></span><span></span><span></span>Загружаем...</div></div>
  </div>

  <div class="card" id="chatCard">
    <div class="lbl">Общий чат 💬</div>
    <div id="msgs"><div class="ld"><span></span><span></span><span></span>Загружаем...</div></div>
    <div class="cinp">
      <input id="ci" type="text" placeholder="Сообщение..." />
      <button id="csb">➤</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const sb = createClient(
  'https://pxqmvgmicxxbkxcrthqz.supabase.co',
  'sb_publishable_B7yD6pvugtqb9g9EZWNo8A_qsWbkpQY'
);

const ONLINE_MS = 3 * 60 * 1000;
const isOnline = ts => !!ts && (Date.now() - new Date(ts).getTime()) < ONLINE_MS;

function fmtS(s) {
  s = Math.floor(s || 0);
  return `${Math.floor(s/3600)}:${String(Math.floor((s%3600)/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}

function ago(ts) {
  const m = Math.floor((Date.now() - new Date(ts).getTime()) / 60000);
  if (m < 1) return 'только что';
  if (m < 60) return `${m} мин назад`;
  const h = Math.floor(m/60);
  return h < 24 ? `${h} ч назад` : `${Math.floor(h/24)} дн назад`;
}

function esc(v) {
  if (v == null) return '';
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  setTimeout(() => el.classList.remove('on'), 2600);
}

// ══════════════════════════════════
//  ТАЙМЕР — старт / пауза / сброс
//  tBase   = накопленные секунды до паузы
//  tStart  = timestamp когда нажали старт
//  tActive = идёт ли сейчас
// ══════════════════════════════════
let tBase = 0, tStart = null, tActive = false, tTick = null;
let hasStatusSeconds = false; // флаг: есть ли колонка в БД

function tFmt() {
  const cur = tActive ? tBase + (Date.now() - tStart) / 1000 : tBase;
  document.getElementById('tCur').textContent = fmtS(tActive ? (Date.now() - tStart) / 1000 : 0);
  document.getElementById('tTot').textContent = fmtS(cur);
}

function tTick_() {
  const elapsed = (Date.now() - tStart) / 1000;
  document.getElementById('tCur').textContent = fmtS(elapsed);
  document.getElementById('tTot').textContent = fmtS(tBase + elapsed);
}

function timerSetStatus(s, tcClass) {
  const box = document.getElementById('timerBox');
  box.className = 'show ' + (tcClass || 'tc4');
  document.getElementById('tName').textContent = s;
  // сброс таймера при смене статуса
  tBase = 0; tStart = null; tActive = false;
  clearInterval(tTick);
  document.getElementById('tCur').textContent = '0:00:00';
  document.getElementById('tTot').textContent = '0:00:00';
  document.getElementById('tRing').classList.remove('spin');
  document.getElementById('tBtnStart').textContent = '▶ Старт';
}

function timerHide() {
  clearInterval(tTick);
  tBase = 0; tStart = null; tActive = false;
  document.getElementById('timerBox').classList.remove('show');
  document.getElementById('tRing').classList.remove('spin');
}

// Старт / возобновить
document.getElementById('tBtnStart').addEventListener('click', () => {
  if (tActive) return;
  tActive = true;
  tStart  = Date.now();
  document.getElementById('tRing').classList.add('spin');
  document.getElementById('tBtnStart').textContent = '▶ Идёт...';
  clearInterval(tTick);
  tTick = setInterval(tTick_, 1000);
  saveTimer();
});

// Пауза
document.getElementById('tBtnStop').addEventListener('click', () => {
  if (!tActive) return;
  tBase  += (Date.now() - tStart) / 1000;
  tActive = false; tStart = null;
  clearInterval(tTick);
  document.getElementById('tRing').classList.remove('spin');
  document.getElementById('tBtnStart').textContent = '▶ Продолжить';
  document.getElementById('tCur').textContent = '0:00:00';
  document.getElementById('tTot').textContent = fmtS(tBase);
  saveTimer();
});

// Сброс
document.getElementById('tBtnReset').addEventListener('click', () => {
  tBase = 0; tStart = null; tActive = false;
  clearInterval(tTick);
  document.getElementById('tRing').classList.remove('spin');
  document.getElementById('tBtnStart').textContent = '▶ Старт';
  document.getElementById('tCur').textContent = '0:00:00';
  document.getElementById('tTot').textContent = '0:00:00';
  saveTimer();
});

async function saveTimer() {
  if (!uid || !hasStatusSeconds) return;
  const total = Math.floor(tBase + (tActive && tStart ? (Date.now() - tStart) / 1000 : 0));
  await sb.from('profiles').update({ status_seconds: total }).eq('id', uid);
}
// ══════════════════════════════════

let uid = null, uname = '', uavatar = '', ustatus = null, lsInt = null, msgs = [];

async function pingLS() {
  if (!uid) return;
  await sb.from('profiles').update({ last_seen: new Date().toISOString() }).eq('id', uid);
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  toast('Открываем Google... 🌸');
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: 'https://kharchenko13.github.io/Xexe' }
  });
  if (error) toast('Ошибка: ' + error.message);
});

function addLogout(container) {
  document.getElementById('logoutBtn')?.remove();
  const b = document.createElement('button');
  b.id = 'logoutBtn'; b.className = 'btn'; b.innerHTML = '🚪 Выйти';
  Object.assign(b.style, {
    background:'linear-gradient(135deg,#ffd0e4,#ffb3ce)', color:'#b5446e',
    fontSize:'.88rem', padding:'8px 16px', marginLeft:'auto'
  });
  b.onclick = async () => {
    await saveTimer();
    timerHide();
    clearInterval(lsInt);
    await sb.auth.signOut();
    toast('Пока! 👋');
  };
  container.appendChild(b);
}

async function load() {
  const { data:{ user } } = await sb.auth.getUser();

  if (!user) {
    uid = null; ustatus = null;
    timerHide(); clearInterval(lsInt);
    document.getElementById('authCard').style.display    = 'block';
    document.getElementById('profileCard').style.display = 'none';
    document.getElementById('statusCard').style.display  = 'none';
    document.getElementById('chatCard').style.display    = 'none';
    loadGroup(null);
    return;
  }

  uid     = user.id;
  uname   = user.user_metadata?.full_name || user.user_metadata?.name || user.email.split('@')[0];
  uavatar = user.user_metadata?.avatar_url || '';

  document.getElementById('authCard').style.display    = 'none';
  document.getElementById('profileCard').style.display = 'block';
  document.getElementById('statusCard').style.display  = 'block';
  document.getElementById('chatCard').style.display    = 'block';

  // Пробуем загрузить профиль — проверяем есть ли status_seconds
  const { data: prof, error: pErr } = await sb
    .from('profiles')
    .select('status, status_seconds, last_seen')
    .eq('id', uid).limit(1);

  if (pErr) {
    // Если ошибка — колонки нет, работаем без неё
    console.warn('profiles fetch:', pErr.message);
    hasStatusSeconds = false;
    const { data: prof2 } = await sb
      .from('profiles')
      .select('status')
      .eq('id', uid).limit(1);
    ustatus = prof2?.[0]?.status || null;
  } else {
    hasStatusSeconds = true;
    ustatus = prof?.[0]?.status || null;
    const saved = prof?.[0]?.status_seconds || 0;
    if (ustatus && saved > 0) {
      tBase = saved;
      document.getElementById('tTot').textContent = fmtS(saved);
    }
  }

  // ping last_seen
  try {
    await sb.from('profiles').update({ last_seen: new Date().toISOString() }).eq('id', uid);
  } catch(e) {}
  clearInterval(lsInt);
  lsInt = setInterval(pingLS, 60_000);

  // Показываем таймер если есть статус
  if (ustatus) {
    const btn = document.querySelector(`.sb[data-s="${ustatus}"]`);
    const tc  = btn?.dataset.tc || 'tc4';
    const box = document.getElementById('timerBox');
    box.className = 'show ' + tc;
    document.getElementById('tName').textContent = ustatus;
    document.getElementById('tTot').textContent = fmtS(tBase);
  }

  const avEl = uavatar
    ? `<img src="${uavatar}" class="av" alt="">`
    : `<div class="avp">${uname[0]?.toUpperCase()||'?'}</div>`;

  document.getElementById('myInfo').innerHTML = `
    ${avEl}
    <div style="flex:1;min-width:0">
      <div style="font-size:1.12rem;font-weight:700;color:var(--text)">${esc(uname)} ✨</div>
      <div id="sDis" style="font-size:.9rem;color:var(--text-light);font-weight:600;margin-top:4px">
        ${ustatus ? 'Сейчас: '+ustatus : 'Статус не выбран'}
      </div>
    </div>`;
  addLogout(document.getElementById('myInfo'));
  hlBtn(ustatus);
  loadGroup(uid);
  loadMsgs();
}

function hlBtn(s) {
  document.querySelectorAll('.sb').forEach(b => b.classList.toggle('on', b.dataset.s === s));
}

async function setStatus(s, color, tc) {
  const { data:{ user } } = await sb.auth.getUser();
  if (!user) { toast('Сначала войди 🌼'); return false; }

  // Сохраняем таймер старого статуса и сбрасываем
  await saveTimer();

  // Формируем payload — без status_seconds если колонки нет
  const payload = {
    id: user.id, username: uname,
    avatar_url: uavatar || null,
    status: s, color,
    last_seen: new Date().toISOString(),
    updated_at: new Date().toISOString(),
  };
  if (hasStatusSeconds) payload.status_seconds = 0;

  const { error } = await sb.from('profiles').upsert(payload, { onConflict:'id' });

  if (error) {
    console.error('setStatus:', error);
    toast('Ошибка: ' + error.message);
    return false;
  }

  ustatus = s;
  timerSetStatus(s, tc); // сбрасываем таймер для нового статуса

  const sd = document.getElementById('sDis');
  if (sd) { sd.textContent = 'Сейчас: ' + s; sd.classList.remove('pop'); void sd.offsetWidth; sd.classList.add('pop'); }
  hlBtn(s);
  return true;
}

async function loadGroup(userId) {
  const cols = hasStatusSeconds
    ? 'id,username,status,color,avatar_url,last_seen,status_seconds'
    : 'id,username,status,color,avatar_url,last_seen';

  const { data, error } = await sb.from('profiles')
    .select(cols)
    .order('username', { ascending: true });

  const el = document.getElementById('gList');

  if (error) {
    console.error('loadGroup:', error);
    el.innerHTML = '<div class="err">Ошибка загрузки 💔<br><small>'+esc(error.message)+'</small></div>';
    return;
  }
  if (!data?.length) {
    el.innerHTML = '<div class="empty">Пока тихо... ☁️</div>';
    return;
  }

  el.innerHTML = data.map(u => {
    const online = isOnline(u.last_seen);
    const me     = u.id === userId;
    const btn    = document.querySelector(`.sb[data-s="${u.status}"]`);
    const tbCls  = btn?.dataset.tb || 'tb4';
    const av = u.avatar_url
      ? `<img src="${u.avatar_url}" class="av" alt="${esc(u.username)}">`
      : `<div class="avp">${(u.username||'?')[0].toUpperCase()}</div>`;
    const badge = (u.status && u.status_seconds > 0)
      ? `<div class="tbadge ${tbCls}">⏱ ${fmtS(u.status_seconds)}</div>` : '';
    const olbl = online
      ? `<span class="onl">● онлайн</span>`
      : `<span class="ofl">○ оффлайн</span>`;
    return `
      <div class="ui" style="${me?'border-color:rgba(200,160,255,.5);background:linear-gradient(135deg,#fdf5ff,#fff0fa);':''}">
        <div class="owrap">${av}<div class="odot ${online?'on':''}"></div></div>
        <div class="inf">
          <div class="uname">${esc(u.username||'—')}${me?' <span style="font-size:.8em;color:#b070e0">это ты</span>':''}${olbl}</div>
          <div class="ust">${esc(u.status||'Без настроения')}</div>
          ${badge}
        </div>
        <div class="sdot" style="--dc:${u.color||'#d0c0f0'}"></div>
      </div>`;
  }).join('');
}

async function loadMsgs() {
  const { data, error } = await sb.from('messages')
    .select('id,user_id,username,avatar_url,text,created_at')
    .order('created_at', { ascending:true }).limit(80);
  if (error) { console.error('loadMsgs:', error); return; }
  msgs = data || [];
  renderMsgs();
}

function renderMsgs() {
  const el = document.getElementById('msgs');
  if (!msgs.length) { el.innerHTML = '<div class="empty">Сообщений пока нет 💬</div>'; return; }
  el.innerHTML = msgs.map(m => {
    const me = m.user_id === uid;
    const av = m.avatar_url
      ? `<img src="${m.avatar_url}" class="avs" alt="">`
      : `<div class="avsp">${(m.username||'?')[0].toUpperCase()}</div>`;
    return `
      <div class="msg ${me?'me':''}">
        ${av}
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;${me?'align-items:flex-end':''}">
          <div class="meta">${me?'Ты':esc(m.username)} · ${ago(m.created_at)}</div>
          <div class="bbl">${esc(m.text)}</div>
        </div>
      </div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
}

async function sendMsg() {
  const inp = document.getElementById('ci');
  const txt = inp.value.trim();
  if (!txt) { toast('Напиши что-нибудь 💬'); return; }
  if (!uid)  { toast('Сначала войди 🌼'); return; }
  inp.value = ''; inp.disabled = true;
  const { error } = await sb.from('messages').insert({
    user_id: uid, username: uname,
    avatar_url: uavatar || null, text: txt,
    created_at: new Date().toISOString()
  });
  inp.disabled = false; inp.focus();
  if (error) { console.error('sendMsg:', error); toast('Ошибка: ' + error.message); return; }
  await loadMsgs();
}

document.getElementById('csb').addEventListener('click', sendMsg);
document.getElementById('ci').addEventListener('keydown', e => {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});

document.querySelectorAll('.sb').forEach(btn => {
  btn.addEventListener('click', async () => {
    if (await setStatus(btn.dataset.s, btn.dataset.c, btn.dataset.tc)) {
      toast(`${btn.dataset.e} ${btn.dataset.s}`);
      loadGroup(uid);
    }
  });
});

sb.channel('chat-rt')
  .on('postgres_changes', { event:'INSERT', schema:'public', table:'messages' }, p => {
    if (p.new.user_id !== uid) { msgs.push(p.new); renderMsgs(); }
  })
  .subscribe();

sb.auth.onAuthStateChange(() => load());
load();

setInterval(() => loadGroup(uid), 6000);

// Автосохранение таймера каждые 30с
setInterval(() => { if (uid && tActive) saveTimer(); }, 30_000);

window.addEventListener('beforeunload', () => { if (uid) saveTimer(); });
</script>
</body>
</html>
